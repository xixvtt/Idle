[project]
name = "idle-daemon"
version = "0.0.1"
description = "Idle daemon — reads Claude Code hooks and transcripts, exposes WebSocket state."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Louis Lao" }]
dependencies = [
    "aiohttp>=3.9",
    "psutil>=5.9",
    "click>=8.1",
]

[project.scripts]
idle-daemon = "idle_daemon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idle_daemon"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
